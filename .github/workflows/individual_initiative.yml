name: Individual Initiative

on:
  schedule:
    # 3 раза в день, смещено от Squad Initiative — 09:30, 14:30, 18:30 Киев
    - cron: '30 6,11,15 * * *'
  workflow_dispatch:
    inputs:
      person:
        description: 'Кто конкретно (пусто = случайный из 16)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  initiative:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run individual initiative
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          AZURE_CLIENT_ID:          ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID:          ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET:      ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_AI_INFERENCE_KEY:   ${{ secrets.AZURE_AI_INFERENCE_KEY }}
          GITHUB_TOKEN:             ${{ secrets.BLD_REPOS_PAT }}
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PERSON="${{ github.event.inputs.person }}"
          if [ -n "$PERSON" ]; then
            python main_individual_initiative.py "$PERSON"
          else
            python main_individual_initiative.py
          fi
