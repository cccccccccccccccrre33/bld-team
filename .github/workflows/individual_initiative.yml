name: Individual Initiative

on:
  schedule:
    # РАНЬШЕ: 3 раза в день, по ОДНОМУ случайному человеку за раз — то
    # есть в моменте на всю компанию реально "работала" одна голова.
    # ТЕПЕРЬ: каждые 4 часа, и каждый тик поднимает НЕСКОЛЬКО человек
    # параллельно (см. INDIVIDUAL_INITIATIVE_BATCH_SIZE ниже и
    # workflows/individual_initiative.py) — так компания реально
    # ощущается как экосистема, а не как редкий одиночный вызов по
    # расписанию. Частота и размер батча — сознательно консервативный
    # дефолт (6 тиков/день × 4 человека = 24 сканирования/день против
    # прежних 3), поднимай через vars ниже, если бюджет позволяет
    # больше, без правки этого файла.
    - cron: '30 3,7,11,15,19,23 * * *'
  workflow_dispatch:
    inputs:
      person:
        description: 'Кто конкретно (пусто = батч из нескольких случайных)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  initiative:
    runs-on: ubuntu-latest
    # Поднято с 20 до 40 — теперь за один тик несколько человек могут
    # параллельно дойти до полного инженерного цикла (ветка -> код ->
    # тесты -> review -> merge) на одном и том же репозитории, а
    # get_repo_write_lock (tools/repo_tools.py) сериализует запись по
    # repo_name — то есть часть времени уходит не на LLM-рассуждения, а
    # на честное ожидание своей очереди писать в тот же репозиторий.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run individual initiative
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          AZURE_CLIENT_ID:          ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID:          ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET:      ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_AI_INFERENCE_KEY:   ${{ secrets.AZURE_AI_INFERENCE_KEY }}
          GITHUB_TOKEN:             ${{ secrets.BLD_REPOS_PAT }}
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
          # Новые тумблеры — задаются в Settings → Secrets and variables →
          # Actions → Variables, без правки кода/этого файла:
          INDIVIDUAL_INITIATIVE_BATCH_SIZE: ${{ vars.INDIVIDUAL_INITIATIVE_BATCH_SIZE }}
          MAX_CONCURRENT_TASKS:             ${{ vars.MAX_CONCURRENT_TASKS }}
        run: |
          PERSON="${{ github.event.inputs.person }}"
          if [ -n "$PERSON" ]; then
            python main_individual_initiative.py "$PERSON"
          else
            python main_individual_initiative.py
          fi
