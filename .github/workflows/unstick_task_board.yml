name: Unstick Task Board

on:
  schedule:
    # РАНЬШЕ этот воркфлоу запускался только руками (workflow_dispatch) —
    # то есть разморозка зависших задач требовала, чтобы кто-то САМ
    # вспомнил зайти в GitHub Actions и нажать кнопку. Именно поэтому
    # зомби-задачи копились неделями между ручными прогонами (см.
    # комментарии "Реконсиляция 20.07.2026" в .state/task_board.json —
    # это и есть след одного такого ручного запуска, после которого
    # новые зависшие задачи снова никто не подчищал до следующего
    # ручного вмешательства).
    #
    # Каждые 2 часа — совпадает с STALE_HOURS в workflows/task_board.py:
    # если процесс завис, к моменту следующего тика он уже точно старше
    # порога и будет пойман. На практике это дублирующая подстраховка —
    # основной путь это автоматическая разморозка внутри
    # get_active_tasks() при каждом обычном прогоне любого воркфлоу
    # компании (их и так много раз в день), но отдельный cron не даёт
    # системе зависнуть в тишине, даже если вдруг ни один другой
    # воркфлоу долго не запускался.
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Реально исправить и закоммитить (true) или только посмотреть (false)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  unstick:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unstick script
        run: |
          # По расписанию (schedule) применяем всегда — там некому
          # смотреть на сухой прогон. Ручной запуск (workflow_dispatch)
          # уважает выбор человека (по умолчанию тоже true, но можно
          # выбрать false, чтобы сперва посмотреть).
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            python tools/unstick_task_board.py --apply
          else
            python tools/unstick_task_board.py
          fi
