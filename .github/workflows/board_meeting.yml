name: Board Meeting

on:
  schedule:
    # Утреннее заседание — 08:00 по Киеву (UTC+3 = 05:00 UTC)
    - cron: '0 5 * * *'
    # Вечернее заседание — 20:00 по Киеву (23:00 UTC предыдущего дня = 17:00 UTC)
    - cron: '0 17 * * *'
  # Ручной запуск с необязательной темой
  workflow_dispatch:
    inputs:
      agenda:
        description: 'Тема заседания (оставь пустым — совет выберет сам)'
        required: false
        default: ''

jobs:
  meeting:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # защита от зависания

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Случайный пропуск: ~30% шанс не проводить заседание
      # Это даёт ощущение что совет собирается по своему желанию, а не по таймеру
      - name: Decide whether to meet
        id: decide
        run: |
          ROLL=$(python3 -c "import random; print(random.randint(1, 10))")
          echo "roll=$ROLL" >> $GITHUB_OUTPUT
          if [ "$ROLL" -le 3 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Совет решил не собираться сегодня (roll=$ROLL/10)"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Заседание состоится (roll=$ROLL/10)"
          fi

      - name: Run board meeting
        if: steps.decide.outputs.skip == 'false'
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          AZURE_CLIENT_ID:          ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID:          ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET:      ${{ secrets.AZURE_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
          # Переопределение моделей (если не задано — берёт defaults из models.py)
          MODEL_BOARD_MEKHMAT:      ${{ vars.MODEL_BOARD_MEKHMAT }}
          MODEL_BOARD_FIZTECH:      ${{ vars.MODEL_BOARD_FIZTECH }}
          MODEL_BOARD_FIZMAT:       ${{ vars.MODEL_BOARD_FIZMAT }}
          MODEL_BOARD_TEHMAT:       ${{ vars.MODEL_BOARD_TEHMAT }}
          MODEL_BOARD_SECRETARY:    ${{ vars.MODEL_BOARD_SECRETARY }}
          MODEL_BOARD_AGENDA:       ${{ vars.MODEL_BOARD_AGENDA }}
        run: |
          AGENDA="${{ github.event.inputs.agenda }}"
          if [ -n "$AGENDA" ]; then
            python main_board.py "$AGENDA"
          else
            python main_board.py
          fi
