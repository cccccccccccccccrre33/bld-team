name: Squad Initiative

on:
  schedule:
    # Было 3 раза/день на 2 отряда (6 запусков/день). Теперь 4 отряда —
    # снижаем до 2 раз/день, чтобы не удвоить косты: 10:00, 17:00 Киев
    # (7, 14 UTC) = 8 запусков/день, шире охват при похожем бюджете.
    - cron: '0 7,14 * * *'
  workflow_dispatch:
    inputs:
      squad:
        description: 'Какой отряд (пусто = все)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - alpha
          - bravo
          - platform
          - product

permissions:
  contents: write

jobs:
  initiative:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run squad initiative
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          AZURE_CLIENT_ID:          ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID:          ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET:      ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_AI_INFERENCE_KEY:   ${{ secrets.AZURE_AI_INFERENCE_KEY }}
          GITHUB_TOKEN:             ${{ secrets.BLD_REPOS_PAT }}
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SQUAD="${{ github.event.inputs.squad }}"
          if [ -n "$SQUAD" ]; then
            python main_squad_initiative.py "$SQUAD"
          else
            python main_squad_initiative.py
          fi
